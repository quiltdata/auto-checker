# yaml-language-server: $schema=./policy.schema.json
# check-commit policy for the `occurrence` package prefix.
#
# Policy is per-prefix: the same packagePrefix that scopes the deployed
# stack's event filter selects this file, so every occurrence/* package is
# governed by one policy. Everything here is derived from the governed
# packages' own record, with citations per item. Protocol-level forms (issue
# folders, immutable turn filenames, route keys, quilt+s3 URI syntax) live in
# the engine; this file holds only what is specific to one prefix.

# Which contract the prefix is checked against. `current` is the folder model
# of spec:protocol/occurrence.md §5; `pre-migration` is the retired flat-issue
# and message-folder model, kept for the historical backtest corpus (§9).
regime: current

# Identity. `author` names the writer in the commit message, which is where
# §3 puts rationale and attribution — never in package metadata. `contributor`
# is the navigational label in a turn filename (§5): human-readable metadata
# only, carrying no provenance authority, no Job, and no casting class.
author: commit-protocol
contributor: Checker

# The workflow every revision must be stamped with (§2), and the registered
# schema `metadata-shape` validates metadata against.
#
# §2 places one obligation on a package writer — use `workflow="occurrence"` —
# and names the registered schema at an unversioned path. It does not require a
# package to vendor its own copy, nor a revision to have been validated against
# a particular schema version. Comparisons against `vendored_schema` are
# therefore reported as notes; the substantive question, whether the metadata
# satisfies the schema, is a `metadata-shape` defect. That the vendored copy
# tracks the registered object is asserted in tests/test_registered_schema.py,
# since it is a fact about this repo rather than about any package.
workflow: occurrence
package_schema_path: protocol/occurrence-workflow-schema.json
vendored_schema: occurrence-workflow-schema.json

# Size watchlist: the prefix's normative governing surface, whose silent
# shrinkage loses standing guidance. Deliberately narrow. Issue turns are
# covered by immutability and issue READMEs are expressly mutable summaries
# (§5), so neither belongs here; `README.md` and `packages.md` are
# navigational indexes that legitimately contract when the model simplifies.
#
# The list spans both surfaces this prefix has had, because one policy governs
# the whole history the corpus replays. Dropping the retired path would not
# make the checker tidier, it would make it forget: the 051 migration's
# 29206 -> 7142 shrink of `protocol/occurrence.md` is a pinned finding, and the
# 056 retirement of that same path is what exercises the retirement allowance
# in `check_watchlist`. Neither judgment survives the pattern's removal.
#
# `actions/` and `reference/` are the surface 056 moved the governing content
# to, named by the package README: `actions/` holds the live operating
# procedures, each "the canonical production surface for its own grammar", and
# `reference/` the shared mechanics. Watching only the retired path left the
# guard pointed at nothing — zero of 106 entries — while three normative
# reference documents lost their trailing newline under a commit message
# claiming byte-identical content (f456e097569f).
#
# `.md` only. `reference/occurrence-workflow-schema.json` is a documentation
# copy whose authoritative version is the registered schema, and §2 requires no
# package copy at all — `schema-drift` already treats its deletion as a note.
# `rubric/` is optional evaluation material and `tools/` is support code;
# neither carries standing guidance.
watchlist:
  - "^protocol/occurrence\\.md$"
  - "^actions/[^/]+\\.md$"
  - "^reference/[^/]+\\.md$"

# A size decrease on a watchlisted artifact counts as declared only if a
# sentence of the commit message names the file AND contains one of these
# stems.
decrease_markers:
  - compress
  - shrink
  - trim
  - condens
  - shorten
  - reduc
  - truncat
  - prune
  - strik
  - delet
  - remov
  - retire
  - fold

# Stems that make a line of a controlling task a retirement declaration.
#
# These are read only from the turns of the issue a revision routes to, and
# only ever admit the removal of a watchlisted path the declaration names by
# its exact logical path. They are the vocabulary of an intentional migration
# rather than of a size reduction, which is why they are a separate list from
# `decrease_markers`: a refactor that retires a live path says "delete",
# "supersede" or "redistribute", and never needs to say "shrink".
retirement_markers:
  - delet
  - remov
  - retire
  - relocat
  - redistribut
  - supersed
  - replac
  - split
  - fold
  - migrat

# §7 requires cross-package evidence to be cited with a revision-pinned URI,
# with one exception: "Current normative Spec guidance may float only when a
# task intentionally asks for current rules." These packages may be cited
# unpinned; every other package may not.
float_ok_packages:
  - occurrence/spec

# ---------------------------------------------------------------------------
# Retired regime. Read only by pre-migration-regime checks, against the
# historical corpus. None of this is live config: the registered schema's
# additionalProperties:false forbids every metadata field named here, and §5
# retired the message-folder filename grammar these adjudications describe.
# Kept because spec:issues/041 and quiltdata/auto-checker#6 are real
# adjudications of the record and should not be lost (auto-checker#13).
# ---------------------------------------------------------------------------
pre_migration:
  # Size watchlist per the pre-migration package README.
  watchlist:
    - "^01-backstory/(0[1-9]|10)P-"
    - "^01-backstory/01-backstory-summary\\.md$"
    - "^02-measure-selection/02-results-summary\\.md$"
    - "^03-conditional-kernel/03\\.01P-"

  # Revision user_meta fields whose values named files the patch claimed to
  # touch, and which part of the actual diff each claim had to land in.
  # Retired 2026-08-13; forbidden by the registered schema since.
  structured_file_fields:
    adds: added
    messages_added: added
    deletes: removed
    changes: changed
    renames: any
    updates: any

  # 01-backstory predated the PARENT.NNL rule and is recorded in the package
  # README as a deviation that is not retrofitted (revision f6c34d02); bare
  # NNL was accepted there and only there.
  grandfathered_bare_folders:
    - 01-backstory

  # Counter collisions adjudicated by the package as a known-unresolved spec
  # condition rather than a defect: all pairs were written against the same
  # head and neither party is recorded as at fault. The first two pairs were
  # adjudicated in issues/closed/030; the remaining four were surfaced by the
  # 166-revision backtest and ruled the same way in auto-checker#6.
  adjudicated_collisions:
    - folder: 02-measure-selection
      counter: "21"
      letters: [K, P]
    - folder: 03-conditional-kernel
      counter: "05"
      letters: [M, P]
    - folder: 01-backstory
      counter: "30"
      letters: [M, P]
    - folder: 01-backstory
      counter: "21"
      letters: [CC, M]
    - folder: 02-measure-selection
      counter: "07"
      letters: [CC, M]
    - folder: 02-measure-selection
      counter: "23"
      letters: [M, P]
  adjudication_cite: issues/closed/030 and quiltdata/auto-checker#6
