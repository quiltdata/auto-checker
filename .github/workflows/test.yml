name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  # The 166-revision backtest (the deploy gate, 04 §8) needs read credentials
  # for the registry bucket; it runs locally / pre-deploy until OIDC is wired.
