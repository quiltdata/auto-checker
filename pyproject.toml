[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "check-commit"
version = "0.3.3"
description = "Deterministic tier-0 checker for governed Quilt packages"
requires-python = ">=3.10"
dependencies = [
    "quilt3>=6.0",
    "boto3>=1.42.1,<2",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    # metadata-shape validates package metadata against the vendored workflow
    # schema. quilt3 already pulls this in for its own workflow validation;
    # named here because check_commit imports it directly.
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
check-commit = "check_commit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
check_commit = ["policies/*.yaml", "policies/*.md", "policies/*.json"]

[tool.pytest.ini_options]
# `pytest` from the repo root must mean the unit suite, not whatever a CDK
# asset bundle happens to have vendored into cdk/cdk.out.
testpaths = ["tests"]
