[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpass"
version = "0.1.0"
description = "Deterministic tier-0 checker for governed Quilt packages"
requires-python = ">=3.10"
dependencies = [
    "quilt3>=6.0",
    "boto3>=1.28",
    "PyYAML>=6.0",
]

[project.scripts]
checkpass = "checkpass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkpass = ["policies/*.yaml"]
