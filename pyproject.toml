[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "check-commit"
version = "0.2.0"
description = "Deterministic tier-0 checker for governed Quilt packages"
requires-python = ">=3.10"
dependencies = [
    "quilt3>=6.0",
    "boto3>=1.28",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
check-commit = "check_commit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
check_commit = ["policies/*.yaml", "policies/*.md", "policies/*.json"]
