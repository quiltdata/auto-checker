# Current-regime acceptance corpus for check-commit.
#
# `occurrence/spec` on `protology`, 57 pointers to the pin. Chosen because it
# is the package that defines the contract: it uses the §5 folder model
# throughout, every revision is stamped `workflow: occurrence`, and its own
# history contains the classes this corpus exists to hold steady — a
# closure-metadata repair, the 056 refactor that retires a watchlisted path
# under an explicit authorization, and the undeclared shrinks of the surface
# that replaced it.
#
# Companion corpus: backtest/expectations.yaml, the pre-migration regime.
#
# Replaying history against today's contract is deliberately anachronistic in
# one direction: writes made before spec:053 (H1-first grammar, 2026-09-08) and
# before the human-readable turn filenames (22e898df, 2026-09-04) are judged by
# the rules that superseded them. §9 keeps those artifacts valid evidence and
# does not retrofit them; the findings below record what the current contract
# says about the writes, not a demand that the bytes change.

regime: current
package: occurrence/spec
registry: s3://protology
# The pin is the closure of issue 056: the refactor that redistributed
# `protocol/*` and `jobs/*` into the `actions/*` and `reference/*` surface is
# complete, accepted, cleaned up, and the issue is closed with its route
# cleared. It ends the corpus because the package is at a settled state there,
# and because the range now contains the whole arc the watchlist is judged on —
# the deliberate retirement of a watched path at `d1a6032c` and the first
# undeclared shrinks of the surface that replaced it.
pin: 50319d33456a63c7d05c9ed4818d0923e710a33ddbae0b66fbe466588e5bf838

must_flag:
  # -- route integrity: §8 step 2 requires closure to clear the route --------
  # d2b7cf60's commit message is "053 closure metadata repair: remove stale
  # route after closed disposition". 3ce3c15d is the revision it repairs: it
  # set issues/053's README to Status: closed and left the route in place.
  3ce3c15d:
    checks: [issue-routes]
    class: route-survives-closure

  # The same class again on issues/054: the README reads Status: closed while
  # the route is still set. Unrepaired at the pin, unlike 053.
  3ae2cb19:
    checks: [issue-routes]
    class: route-survives-closure

  # -- issue README grammar: §5 closure provenance ---------------------------
  # "Close 052 after Executive acceptance" set Status: closed without the
  # required Closed and Closed-By fields. Still absent at the pin.
  d883aaff:
    checks: [issue-readme]
    class: closure-provenance-missing

  # A new issue README must lead with its H1 (§5 as amended by spec:053). The
  # 053 README was itself written header-first and corrected one revision
  # later by 0237777f — "move the README header after the H1 so it matches the
  # form it proposes" — so the record adjudicates this one directly.
  8c36d359:
    checks: [issue-readme]
    class: header-before-h1
    evidence: 0237777f

  # -- the 051 migration, three classes in one revision ---------------------
  # Three turns landed with pure numeric filenames, two issue READMEs were
  # created header-first, and protocol/occurrence.md fell 29206 -> 7142 bytes
  # with no reduction named in the commit message. Two turns were also
  # relocated logical-only (001.md, 002.md still backed at issues/051aO-...
  # and issues/051bP-...); that class is no longer a defect — see
  # must_not_flag below.
  fc69cb94-turn-form:
    hash: fc69cb94
    checks: [turn-form]
    class: numeric-turn-name
  fc69cb94-readme:
    hash: fc69cb94
    checks: [issue-readme]
    class: header-before-h1
  fc69cb94-watchlist:
    hash: fc69cb94
    checks: [watchlist-size]
    class: undeclared-shrink

  # -- the surface that replaced protocol/, now that it is watched -----------
  # Watching only `protocol/occurrence.md` left the guard pointed at nothing
  # once 056 retired that path: zero of 106 entries. These two revisions are
  # what the gap let through, and they are the reason `actions/` and
  # `reference/` are on the watchlist.
  #
  # "056.09 Write 1: repair bounded semantic-preservation defects in four
  # audited live files" shrank a live action document by 10 bytes. A repair may
  # well need to, but §4's declaration duty is what makes the difference
  # visible, and the message names no reduction of this file.
  767d9f8e:
    checks: [watchlist-size]
    class: undeclared-shrink

  # "056.13 cleanup Write 1: normalize three live reference logical entries onto
  # physical reference/ keys with byte-identical content" — the content was not
  # byte-identical. All three copies dropped their trailing newline
  # (`b'ack.\n'` -> `b'back.'`); the two `.md` files are watched and reported,
  # and the JSON is not on the watchlist because §2 requires no package copy of
  # the registered schema at all.
  #
  # A newline is a small thing to fault, and pinning it is deliberate. The claim
  # was byte-identical and nothing else in the engine tests such a claim:
  # `key-drift` observes only placement, and the digest comparison changed
  # algorithm across these entries. Sized-based shrink detection is the only
  # thing that noticed at all.
  f456e097:
    checks: [watchlist-size]
    class: undeclared-shrink

  # -- turn filenames: §5 makes pure numeric noncanonical for new turns -----
  53ef2e8e: {checks: [turn-form], class: numeric-turn-name}
  e8b80c19: {checks: [turn-form], class: numeric-turn-name}
  0ec48cc4: {checks: [turn-form], class: numeric-turn-name}

# Required false negatives are asserted by must_not_flag: revisions the current
# contract clears. The pin is the closure-metadata repair itself and must come
# back clean; the two no-op verification revisions must not manufacture
# findings from an empty diff.
must_not_flag:
  # -- a watchlisted path may be retired by the task that authorized it ------
  # The pin removes protocol/occurrence.md, which is the whole of the current
  # watchlist, and redistributes it into actions/* and reference/*. That is
  # not the silent loss the watchlist exists to catch: issues/056's filed
  # Owner task enumerates the exact logical path under "Delete these old live
  # paths only after their current content has been redistributed".
  #
  # The class the contract had not modelled is a semantic successor with an
  # intentional live-path retirement. `watchlist-size` now reads the filed
  # turns of an issue the revision routes to and records the removal as a note
  # naming the authorizing document, instead of faulting it. Pinned here so
  # the allowance keeps working and so a regression to DEFECT fails the gate.
  #
  # This expectation is only meaningful while `protocol/occurrence.md` stays on
  # the watchlist. Drop that pattern and the removal is not examined at all, so
  # this would pass for the wrong reason and the allowance would go untested
  # against the revision it was written for.
  #
  # The strictness it does not give up is asserted in tests/test_checks.py: an
  # exact logical path is required, a prohibition is not a declaration, an
  # unrouted issue does not speak for the write, the mutable issue README
  # never authorizes, and a shrink is still held to the commit message alone.
  - hash: d1a6032c
    checks: [watchlist-size]
    class: watched-path-retired-by-the-controlling-task

  # 056 closed in place with its route cleared, which is what §8 step 2 asks
  # and the inverse of the 053 and 054 failures pinned above. The pin.
  - hash: 50319d33
    checks: [issue-routes]
    class: closure-clears-its-own-route

  - hash: d2b7cf60  # the 053 route repair: route removed, nothing else touched
  - hash: 0237777f  # 053 README moved to H1-first
  - hash: 6f0d11f5  # protocol cleanup, -6 entries, declared and arithmetic
  - hash: ec34d58a  # no-op metadata verification
  - hash: 22e898df  # turn filenames made human-readable, net zero

  # -- logical/physical placement is not a defect ---------------------------
  # These two revisions formerly stood as must_flag for
  # key-drift/logical-physical-drift, and now assert the opposite. Closing
  # 047-050 (c29849f2) relocated four dispositions into issues/closed/ in the
  # manifest while their objects stayed at issues/; the 051 migration
  # (fc69cb94) did the same for two turns.
  #
  # The contract says nothing about physical placement — it speaks only of
  # logical paths — and a Quilt package is a manifest of references, so
  # referencing an object in place is supported use rather than a fault. The
  # class was originally met as a botched closure relocation (auto-checker#12),
  # and §8 has since removed relocation from the model: "There is no
  # issues/closed/ relocation for current-model issues... Nothing moves."
  # With nothing relocating, a mismatch no longer evidences a failed move.
  #
  # They are pinned here rather than deleted so the reversal stays visible and
  # a reintroduction of the defect fails the gate. The observation survives as
  # a note; only the verdict is gone.
  - hash: c29849f2
    checks: [key-drift]
    class: logical-physical-placement-is-not-a-defect
  - hash: fc69cb94
    checks: [key-drift]
    class: logical-physical-placement-is-not-a-defect

# Adjudications the corpus records as known-unresolved rather than as faults.
known_unresolved:
  # `056.04a-PM-review-of-implementation-task.md` — a review turn filed with a
  # letter-suffixed turn number, which the §5 filename form does not admit. §5
  # states that form as its only SHOULD, so the departure is recorded and not
  # faulted. It matters twice over: this same turn is part of the change
  # contract the pin's retirement is read from, and `_contract_turns`
  # deliberately does not require a turn filename to parse before its
  # declaration counts.
  - hash: 7bea0b03
    checks: [turn-form]
    paths_contain: 056.04a

  # `056.12a-PM-reference-key-divergence.md` — the same letter-suffixed form,
  # and the turn in which the package independently recorded the logical/physical
  # divergence across `reference/` that `key-drift` had been noting. 056.13 then
  # normalized those three entries, which is where the trailing newlines went.
  - hash: 9d836af3
    checks: [turn-form]
    paths_contain: 056.12a
